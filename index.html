    <!-- Applies the saved theme before first paint so the page never flashes the wrong theme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
        } catch (e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
